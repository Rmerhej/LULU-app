# Intégration continue :
# - à chaque Pull Request : tests + vérification que l'image Docker se construit ;
# - à chaque push sur main : tests, publication de l'image sur Docker Hub
#   en deux versions (PC amd64 et serveur Oracle ARM arm64), puis mise en ligne
#   automatique sur le serveur fle-presence.
# Résultat visible dans l'onglet "Actions" du dépôt et directement dans chaque Pull Request.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Droits minimum : lecture seule du code
permissions:
  contents: read

jobs:
  tests:
    name: Tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lancer les tests
        # Aucun secret nécessaire : les tests utilisent H2 et des identifiants factices
        run: |
          chmod +x mvnw
          ./mvnw -B test

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Émulation ARM : permet de produire l'image pour le serveur Oracle (arm64)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Pull Request : on vérifie seulement que l'image se construit (rien n'est publié)
      - name: Construire l'image (vérification)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      # Push sur main : publication sur Docker Hub
      # Secrets à créer dans Settings > Secrets and variables > Actions :
      # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton Docker Hub en lecture/écriture)
      - name: Connexion à Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lulu-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lulu-app:${{ github.sha }}

  deploiement:
    name: Mise en ligne
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    # Jamais deux mises en ligne en même temps
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # Secrets : SERVEUR_HOTE, SERVEUR_UTILISATEUR, SERVEUR_CLE_SSH (clé réservée au déploiement)
      - name: Préparer la connexion SSH
        env:
          CLE: ${{ secrets.SERVEUR_CLE_SSH }}
          HOTE: ${{ secrets.SERVEUR_HOTE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mettre le serveur à jour
        env:
          HOTE: ${{ secrets.SERVEUR_HOTE }}
          UTILISATEUR: ${{ secrets.SERVEUR_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes "$UTILISATEUR@$HOTE" '
            if [ -d ~/lulu-app ]; then
              bash ~/lulu-app/deploy/mise-a-jour.sh
            else
              echo "LULU n'"'"'est pas encore installée sur le serveur (~/lulu-app absent) : rien à mettre à jour."
            fi'

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploiement
