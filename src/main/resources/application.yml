spring:
  application:
    name: lulu-app

  # Lit les variables du fichier .env (ignoré par Git) à la racine du projet
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3309/lulu_app?serverTimezone=UTC
    username: lulu_app
    password: ${DB_PASSWORD}

  # ----- IA : Gemini via Spring AI -----
  ai:
    google:
      genai:
        api-key: ${lulu.ai.api-key}
        chat:
          # Modifiable dans .env (GEMINI_MODEL) si Google retire ou sature un modèle
          model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
          temperature: 0.3
    retry:
      max-attempts: 2

  # ----- Flyway gère le schéma (db/migration) -----
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  # 8081 : LULU-app peut tourner en même temps qu'AI Prospect Hunter (8080)
  port: 8081
  # Derrière Caddy (HTTPS) : on fait confiance aux en-têtes X-Forwarded-* envoyés par le proxy.
  # Spring sait alors que la visite est en HTTPS (cookies "Secure", HSTS, vraie adresse IP du visiteur).
  forward-headers-strategy: native
  servlet:
    session:
      persistent: false
      cookie:
        http-only: true
        same-site: lax

lulu:
  ai:
    # Valeur par défaut : l'application démarre sans clé, l'analyse affiche un message clair
    api-key: ${GEMINI_API_KEY:a-configurer}

  # API Adzuna (offres d'emploi, gratuite) : https://developer.adzuna.com
  adzuna:
    base-url: https://api.adzuna.com
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: fr
    # Zone de recherche proposée par défaut (modifiable dans le formulaire)
    where: Ile-de-France

  # Connexion à l'application (lus dans .env)
  security:
    username: ${APP_USERNAME:lulu}
    password: ${APP_PASSWORD:}
