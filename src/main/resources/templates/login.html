<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>

<body>
<main class="lulu-login">
    <div class="lulu-panel">
        <p class="lulu-brand text-center mb-1" style="color: var(--lulu-ink)">LULU</p>
        <p class="text-center lulu-figure-label mb-4">Carnet de candidatures</p>

        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            Identifiant ou mot de passe incorrect.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2" role="status">
            Vous êtes déconnectée.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Identifiant</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-lulu w-100">Se connecter</button>
        </form>
    </div>
</main>
</body>
</html>
